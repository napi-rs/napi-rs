[package]
edition = "2021"
name = "napi-wasi-heap-sync-example"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { path = "../../crates/napi", default-features = false, features = [
  "napi4",
] }
napi-derive = { path = "../../crates/macro", features = ["type-def"] }

[build-dependencies]
napi-build = { path = "../../crates/build" }
