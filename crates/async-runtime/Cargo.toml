[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
description = "Shared pluggable async runtime for napi-rs addons: a tokio-free async/CPU/blocking scheduler plus an optional napi AsyncRuntime SPI adapter"
edition = "2024"
keywords = ["NodeJS", "Node", "async", "runtime", "NAPI"]
license = "MIT"
name = "napi-async-runtime"
readme = "README.md"
repository = "https://github.com/napi-rs/napi-rs"
rust-version.workspace = true
version = "0.2.11"

[features]
default = ["napi"]
napi = ["napi-backend", "napi-task-host", "napi-timer-host", "napi-js-config"]
napi-backend = ["dep:napi", "dep:napi-derive"]
# Exports contract version 4's task-host functions WITHOUT `registerTimerHost`
# or `unregisterTimerHost`. Standard contract-v4 tooling requires all 7 exports:
# `@napi-rs/cli`'s `napi.wasm.asyncRuntime` build check rejects missing timer
# exports when generating WASI loaders with `type-def` metadata (and defers to
# load-time checks without `type-def` or under `--binary-only`),
# `@napi-rs/async-runtime`'s `installCurrentThreadHosts` throws
# `BindingMismatchError`, and the deferred workerd loader's
# `registerWorkerdTimerHost` throws `TypeError` when host timers are available.
# Addons using standard loaders must pair `napi-task-host` with either
# `napi-timer-host` (full JS timer relay) or `napi-timer-host-stub` (record-only
# stub); enable `napi-task-host` alone only for custom/manual task-host wiring.
napi-task-host = ["napi-backend"]
napi-timer-host = ["napi-task-host"]
napi-timer-host-stub = ["napi-task-host"]
napi-js-config = ["napi-backend"]

[dependencies]
arc-swap = "1"
async-task = "4.7.1"
futures = "0.3"
rustc-hash = "2"

[dependencies.napi]
path = "../napi"
version = "3.16.3"
default-features = false
features = ["napi4", "async-runtime"]
optional = true

[dependencies.napi-derive]
path = "../macro"
version = "3.7.2"
default-features = false
features = ["type-def"]
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1.12"
crossbeam-deque = "0.8"

# Cargo resolves target tables from `rustc --print cfg`, which is IDENTICAL for
# the two WASI targets (see build.rs), so no `cfg()` table can name the threads
# triple. The exact triple is the only spelling that gives it rayon without
# dragging rayon into the threadless `wasm32-wasip1` artifact.
#
# napi-sys holds the memory-size state that napi's allocator lock and this
# crate's scheduler handoffs share (`napi_sys::wasi_heap_sync`). It depends on
# neither napi nor this crate, so there is no cycle, and that module defines
# and imports no symbol, so the napi-free test binary still links under a bare
# WASI host.
[target.wasm32-wasip1-threads.dependencies]
rayon = "1.12"
crossbeam-deque = "0.8"
napi-sys = { path = "../sys", version = "3.4.1", default-features = false }

# The in-crate test binaries are plain executables rather than Node-loaded
# cdylibs; `dyn-symbols` resolves Node-API symbols at runtime so those
# binaries can link. Shipped builds keep the minimal feature set above.
# wasm test binaries run under a bare WASI host with no Node-API at all and
# never reference this crate, so it is excluded there rather than compiled and
# then dropped by the linker.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
napi = { path = "../napi", version = "3.16.3", default-features = false, features = [
  "dyn-symbols",
] }
