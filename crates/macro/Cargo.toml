[package]
authors = ["LongYinan <lynweklm@gmail.com>", "Forehalo <forehalo@gmail.com>"]
description = "N-API procedural macros"
edition = "2021"
keywords = ["NodeJS", "FFI", "NAPI", "n-api"]
license = "MIT"
name = "napi-derive"
readme = "README.md"
repository = "https://github.com/napi-rs/napi-rs"
rust-version.workspace = true
version = "3.7.2"

[package.metadata.workspaces]
independent = true

[features]
compat-mode = []
# Kept as a no-op feature for strict 3.x semver compatibility; the `ctor` dependency is unused.
ctor = []
default = ["type-def", "strict"]
full = ["type-def", "strict", "compat-mode"]
noop = ["napi-derive-backend/noop"]
strict = ["napi-derive-backend/strict"]
tracing = ["napi-derive-backend/tracing"]
type-def = ["napi-derive-backend/type-def"]

[dependencies]
convert_case = "0.12"
napi-derive-backend = { version = "7.0.1", path = "../backend" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["fold", "full", "extra-traits"] }

[lib]
proc-macro = true
