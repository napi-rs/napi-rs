[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
description = "N-API build support"
edition = "2021"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["NodeJS", "FFI", "NAPI", "n-api"]
license = "MIT"
name = "napi-build"
readme = "README.md"
repository = "https://github.com/napi-rs/napi-rs"
rust-version.workspace = true
version = "2.6.0"

[features]
# Wrap wasi-libc's allocator on wasm32-wasip1-threads (see `src/wasi.rs`). For
# the `napi` crate, which defines the wrappers: without them the link fails.
wasi-heap-sync = []

[package.metadata.workspaces]
independent = true
