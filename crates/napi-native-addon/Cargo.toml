[package]
name = "napi-native-addon"
version = "0.0.0"
edition = "2021"
publish = false
description = "Compressed native-addon carrier, decoder, cache, and optional Btrfs replacement."

[lints]
workspace = true

# The producer emits zstd only. Keep optional dictionary and legacy format
# support out of the trampoline.
[dependencies]
zstd = { version = "0.13", default-features = false }

# Btrfs ioctls and per-user cache names use libc on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }
