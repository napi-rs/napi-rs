[workspace]
resolver = "2"
members = [
  "./crates/async-runtime",
  "./crates/backend",
  "./crates/build",
  "./crates/napi-native-addon",
  "./crates/napi-native-addon-stub",
  "./crates/macro",
  "./crates/napi-compress",
  "./crates/napi",
  "./crates/sys",
  "./examples/napi",
  "./examples/napi-shared",
  "./examples/napi-compat-mode",
  "./examples/custom-async-runtime",
  "./examples/shared-async-runtime",
  "./examples/wasi-heap-sync",
  "./examples/binary",
  "./bench",
  "./memory-testing",
  "./examples/napi-cargo-test",
]
exclude = ["./testing"]

[workspace.package]
rust-version = "1.88"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"     # Must be opt-in
print_stderr = "warn"     # Must be opt-in
allow_attributes = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.release]
lto = true

# Size-tuned profile for the native-addon stub. Nightly builds also strip std.
[profile.addon-min]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.wasi]
inherits = "release"
opt-level = "z"
debug = true

[profile.napi-rs-custom]
inherits = "dev"
codegen-units = 1024
